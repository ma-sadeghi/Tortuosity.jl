name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'lts'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          # Apple Silicon runner exercises the Metal backend via
          # KernelAbstractions. Metal.jl is installed at runtime by
          # test/runtests.jl since its Apple-only artifacts can't live
          # in [extras]. Test both Julia 1 and LTS for parity with ubuntu.
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: 'lts'
            os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # `overlap_indices_fast` chunks its input across `Threads.nthreads()`
          # and concatenates the per-thread results. At one thread that reduces
          # to a single chunk, so the multi-chunk merge — and the ordering
          # guarantee that depends on it — is never executed. Run the suite with
          # several threads so that path is actually covered.
          JULIA_NUM_THREADS: '4'
